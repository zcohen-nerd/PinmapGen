name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Need full history for changelog
        
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        
    - name: Get version from tag or input
      id: version
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=${{ github.event.inputs.version }}
        fi
        VERSION_NUMBER=${VERSION#v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_OUTPUT
        echo "Version: $VERSION ($VERSION_NUMBER)"
        
    - name: Validate version format
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid version format: $VERSION (expected: v0.1.0)"
          exit 1
        fi
        echo "✅ Version format is valid: $VERSION"

    - name: Tag is unused / not being moved
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        # Published tags are immutable. If a workflow_dispatch names a tag that
        # already points at a different commit, or a release already exists for
        # it, refuse — cut the next number instead.
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          TAG_COMMIT=$(git rev-list -n1 "$VERSION")
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "❌ Tag $VERSION already exists at $TAG_COMMIT (≠ $GITHUB_SHA). Never move a published tag — use the next unused number."
            exit 1
          fi
        fi
        echo "✅ $VERSION is not moving an existing tag."

    - name: All version surfaces agree (tag == pyproject == CLI --version == generated artifact)
      run: |
        VERSION_NUMBER=${{ steps.version.outputs.VERSION_NUMBER }}

        PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        [ "$VERSION_NUMBER" = "$PYPROJECT_VERSION" ] || { echo "❌ tag $VERSION_NUMBER != pyproject $PYPROJECT_VERSION"; exit 1; }

        PKG_VERSION=$(python -c "from tools.pinmapgen import __version__; print(__version__)")
        [ "$VERSION_NUMBER" = "$PKG_VERSION" ] || { echo "❌ tag $VERSION_NUMBER != tools.pinmapgen.__version__ $PKG_VERSION (bump _FALLBACK_VERSION)"; exit 1; }

        CLI_VERSION=$(python -m tools.pinmapgen.cli --version | tr -d '\r' | awk '{print $NF}')
        [ "$VERSION_NUMBER" = "$CLI_VERSION" ] || { echo "❌ tag $VERSION_NUMBER != CLI --version $CLI_VERSION"; exit 1; }

        # Generate a fresh pinmap.json and confirm it stamps the same version.
        python -m tools.pinmapgen.cli \
          --csv hardware/exports/sample_netlist.csv --mcu rp2040 --mcu-ref U1 \
          --out-root "$RUNNER_TEMP/relcheck" --strict
        GEN_VERSION=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['generated']['version'])" "$RUNNER_TEMP/relcheck/pinmaps/pinmap.json")
        [ "$VERSION_NUMBER" = "$GEN_VERSION" ] || { echo "❌ tag $VERSION_NUMBER != generated pinmap.json version $GEN_VERSION"; exit 1; }

        echo "✅ tag / pyproject / __version__ / CLI --version / generated artifact all = $VERSION_NUMBER"

    - name: Run test suite (tag contents)
      run: python -m unittest discover -s tests

    - name: Generate release artifacts
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}

        # Generate pinmaps with current sample data — strict, so a
        # broken sample can never ship in a release.
        echo "📦 Generating sample pinmaps for release..."
        python -m tools.pinmapgen.cli \
          --csv hardware/exports/sample_netlist.csv \
          --mcu rp2040 \
          --mcu-ref U1 \
          --out-root . \
          --mermaid \
          --strict

        # Create release package
        mkdir -p release_artifacts

        # Create source archive
        git archive --format=tar.gz --prefix=pinmapgen-${VERSION#v}/ HEAD > release_artifacts/pinmapgen-${VERSION#v}-source.tar.gz

        # Build the installable wheel (same artifact the packaging CI
        # job verifies — ships the TOML profiles)
        python -m pip install --upgrade pip
        python -m pip wheel --no-deps -w release_artifacts/ .

        # Create example project package
        tar -czf release_artifacts/pinmapgen-${VERSION#v}-example.tar.gz \
          hardware/exports/sample_netlist.csv \
          pinmaps/ \
          firmware/ \
          README.md \
          LICENSE \
          pyproject.toml
          
    - name: Generate changelog
      id: changelog
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        
        # Get the previous tag
        PREV_TAG=$(git tag --sort=-version:refname | grep -v "^$VERSION$" | head -n1 || echo "")
        
        echo "📝 Generating changelog..."
        if [ -n "$PREV_TAG" ]; then
          echo "Changes from $PREV_TAG to $VERSION:"
          echo ""
          git log --oneline --no-merges $PREV_TAG..HEAD
        else
          echo "Initial release $VERSION"
        fi > CHANGELOG.md
        
        # Set output for use in release
        echo 'CHANGELOG<<EOF' >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        VERSION_NUMBER=${{ steps.version.outputs.VERSION_NUMBER }}
        CHANGELOG="${{ steps.changelog.outputs.CHANGELOG }}"

        # Write release notes to a file to avoid YAML/shell quoting issues
        cat > release_notes.md << NOTES_EOF
        ## PinmapGen Release $VERSION

        A Python toolchain that bridges Fusion Electronics (EAGLE) exports to firmware projects.

        ### Features
        - Multi-MCU support: 13 built-in profiles (RP2040, RP2350, ESP32, ESP32-S3, ESP32-C3, STM32G0, STM32F411, STM32H743, nRF52840, ATmega328P, ATmega2560, ATSAMD21, ATSAMD51)
        - Declarative TOML profiles with schema validation — add new MCUs without writing Python
        - Multi-format input (EAGLE .sch, CSV exports)
        - Multiple output formats (JSON, MicroPython, Arduino, Markdown, Mermaid)
        - Profile management CLI (\`profiles list\`, \`profiles check\`)
        - File watching for automatic regeneration
        - Reproducible builds with \`--reproducible\` flag
        - VS Code integration with tasks and snippets
        - GitHub Actions CI/CD with validation workflows

        ### What's Changed
        $CHANGELOG

        ### Installation

        \`\`\`bash
        # Download and extract the source
        wget https://github.com/${{ github.repository }}/releases/download/$VERSION/pinmapgen-$VERSION_NUMBER-source.tar.gz
        tar -xzf pinmapgen-$VERSION_NUMBER-source.tar.gz
        cd pinmapgen-$VERSION_NUMBER

        # Optional: editable install (adds the 'pinmapgen' command and lets
        # it run from any directory). PinmapGen is stdlib-only, so you can
        # also skip this and run python -m tools.pinmapgen.cli from here.
        pip install -e .
        \`\`\`

        ### Quick Start

        \`\`\`bash
        # Generate for RP2040
        python -m tools.pinmapgen.cli --csv hardware/exports/sample_netlist.csv --mcu rp2040 --mcu-ref U1 --out-root . --mermaid

        # List all available MCU profiles
        python -m tools.pinmapgen.cli profiles list

        # Validate a profile
        python -m tools.pinmapgen.cli profiles check rp2040
        \`\`\`

        ### Files
        - \`pinmapgen-$VERSION_NUMBER-source.tar.gz\` — Complete source code
        - \`pinmapgen-$VERSION_NUMBER-py3-none-any.whl\` — Installable wheel (\`pip install <file>\`)
        - \`pinmapgen-$VERSION_NUMBER-example.tar.gz\` — Example project with generated outputs

        Full documentation available in the repository README.
        NOTES_EOF

        gh release create "$VERSION" \
          --title "PinmapGen $VERSION" \
          --notes-file release_notes.md \
          release_artifacts/pinmapgen-$VERSION_NUMBER-source.tar.gz \
          release_artifacts/pinmapgen-$VERSION_NUMBER-py3-none-any.whl \
          release_artifacts/pinmapgen-$VERSION_NUMBER-example.tar.gz
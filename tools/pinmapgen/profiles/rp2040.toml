# RP2040 — Raspberry Pi RP2040 dual-core ARM Cortex-M0+
# Canonical pin names: GP0 – GP29

[profile]
schema_version = 1
name           = "rp2040"
display_name = "RP2040"
description = "Raspberry Pi RP2040 dual-core ARM Cortex-M0+ (QFN-56)"
family      = "rp2"

# ── Normalization ──────────────────────────────────────────────────────────

[normalization]
canonical_prefix = "GP"
allow_numeric    = true

[[normalization.patterns]]
regex  = "GPIO(\\d+)"
output = "GP{0}"

[[normalization.patterns]]
regex  = "IO(\\d+)"
output = "GP{0}"

# NOTE: USB D+/D- are dedicated pins on the RP2040 (QFN-56 pins 47/46),
# not GPIO-muxed — so there are deliberately no USB aliases here. A pin
# named USB_DP/USB_DM in a netlist is dropped with a warning rather than
# silently mapped onto a GPIO. (GP24/GP25 are ordinary GPIOs on the chip;
# the Raspberry Pi Pico *board* happens to wire GP24 to VBUS sense and
# GP25 to the on-board LED.)
[normalization.aliases]
ADC0    = "GP26"
ADC1    = "GP27"
ADC2    = "GP28"
ADC3    = "GP29"

# ── Pin definitions ───────────────────────────────────────────────────────

[[pins.groups]]
range        = { prefix = "GP", start = 0, end = 29 }
capabilities = [
    "gpio", "pwm",
    "i2c_sda", "i2c_scl",
    "spi_mosi", "spi_miso", "spi_sck", "spi_cs",
    "uart_tx", "uart_rx",
]

# GP23–GP25 are ordinary full-mux GPIOs on the RP2040 *chip*. On the
# Raspberry Pi Pico *board* they are wired to SMPS power-save (GP23),
# VBUS sense (GP24), and the on-board LED (GP25) — board facts that do
# not belong in a chip profile, so no special functions are declared.
# USB D+/D- are dedicated pins (QFN-56 47/46), not GPIOs; they are
# intentionally absent from this pin list (same treatment as rp2350).

# GP26–GP29 — ADC channels (also have full peripheral mux)
[[pins.individual]]
name                  = "GP26"
add_capabilities      = ["adc"]
special_function      = "ADC Channel 0"
special_function_short = "ADC0"

[[pins.individual]]
name                  = "GP27"
add_capabilities      = ["adc"]
special_function      = "ADC Channel 1"
special_function_short = "ADC1"

[[pins.individual]]
name                  = "GP28"
add_capabilities      = ["adc"]
special_function      = "ADC Channel 2"
special_function_short = "ADC2"

[[pins.individual]]
name                  = "GP29"
add_capabilities      = ["adc"]
special_function      = "ADC Channel 3"
special_function_short = "ADC3"

# ── Peripherals ───────────────────────────────────────────────────────────

[[peripherals]]
name     = "I2C"
instance = 0
pins     = { sda = "configurable", scl = "configurable" }

[[peripherals]]
name     = "I2C"
instance = 1
pins     = { sda = "configurable", scl = "configurable" }

[[peripherals]]
name     = "SPI"
instance = 0
pins     = { mosi = "configurable", miso = "configurable", sck = "configurable", cs = "configurable" }

[[peripherals]]
name     = "SPI"
instance = 1
pins     = { mosi = "configurable", miso = "configurable", sck = "configurable", cs = "configurable" }

[[peripherals]]
name     = "UART"
instance = 0
pins     = { tx = "configurable", rx = "configurable" }

[[peripherals]]
name     = "UART"
instance = 1
pins     = { tx = "configurable", rx = "configurable" }

# USB is served by dedicated (non-GPIO) pins, so no USB peripheral with
# GPIO pin assignments is declared — matching rp2350.toml.

[[peripherals]]
name     = "ADC"
instance = 0
pins     = { ch0 = "GP26", ch1 = "GP27", ch2 = "GP28", ch3 = "GP29" }
